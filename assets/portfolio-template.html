    }

    html[data-style="instrument-blue"]{--ink:#10233e;--paper:#f4f6f8;--paper-2:#dfe7ee;--paper-soft:#e8edf2;--accent:#1c67d2;--accent-text:#1c67d2;--accent-on-dark:#80b2ff;--on-accent:#fff;--on-accent-muted:#fff;--muted:#566779;--line:rgba(16,35,62,.22);--pad:clamp(28px,4.4vw,82px);--grid-opacity:.19;--grid-size:4.166vw;--display:var(--sans);--title-weight:650;--title-tracking:-.055em;--label-tracking:.12em;--frame-border:1px solid rgba(16,35,62,.2);--figure-gap:7px;--dark-ink:#edf4ff;--dark-paper:#10233e;--dark-paper-2:#193453;--dark-muted:#b7c8dc;--dark-line:rgba(237,244,255,.2);--chrome-bg:rgba(8,23,42,.97);--chrome-ink:#edf4ff;--chrome-border:rgba(237,244,255,.28)}

    body{overflow:hidden}.deck{display:flex;width:100vw;height:100svh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:auto;scrollbar-width:none}.deck::-webkit-scrollbar{display:none}

    h1,h2,p{margin:0}h1,h2{font-family:var(--display)}.title-hero{font-size:clamp(58px,9vw,156px);line-height:.88;letter-spacing:calc(var(--title-tracking) - .02em);font-weight:var(--title-weight);max-width:12ch}.title-xl{font-size:clamp(46px,6.2vw,108px);line-height:.95;letter-spacing:var(--title-tracking);font-weight:var(--title-weight);max-width:16ch}.slide-head h1{font-size:clamp(38px,4.7vw,78px);line-height:1;letter-spacing:var(--title-tracking);font-weight:var(--title-weight);max-width:18ch}
    .eyebrow,.label,.meta,.caption,figcaption{font-family:var(--mono);text-transform:uppercase;letter-spacing:var(--label-tracking);font-size:clamp(10px,.8vw,14px);line-height:1.45}.eyebrow,.label{color:var(--accent-text);font-weight:700}.lead{font-size:clamp(20px,2vw,34px);line-height:1.35;max-width:38ch}.body{font-size:clamp(16px,1.25vw,22px);line-height:1.55;max-width:56ch;color:var(--muted)}

    .hero-frame{flex:1;min-height:0}.hero-frame img{height:100%;object-fit:cover}.data-table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.05vw,19px);line-height:1.4}.data-table th,.data-table td{border-top:1px solid var(--line);padding:clamp(10px,1.2vw,18px) 12px;text-align:left;vertical-align:top}.data-table thead th{font:700 clamp(10px,.8vw,14px)/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}.data-table tbody th{font-family:var(--mono);color:var(--accent-text)}

    .instrument-register,.instrument-scale,.instrument-finding{display:grid;align-items:center;font:700 clamp(9px,.7vw,12px)/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.instrument-register{grid-template-columns:1fr auto auto;gap:28px;border-bottom:1px solid var(--line);padding-bottom:14px}.instrument-cover-grid{flex:1;display:grid;grid-template-columns:9fr 3fr;align-items:end}.instrument-cover-grid .title-hero{font-size:clamp(76px,12vw,198px);max-width:7ch}.instrument-coordinate{border-left:1px solid var(--line);padding-left:22px;display:grid;gap:16px}.instrument-coordinate b{font:300 clamp(100px,13vw,210px)/.75 var(--sans);color:var(--accent-on-dark)}.instrument-coordinate p{font:700 clamp(11px,.85vw,15px)/1.35 var(--mono);text-transform:uppercase}.instrument-scale{grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding-top:10px}.instrument-scale span:not(:first-child){text-align:right}

    <div class="controls"><button id="prev" aria-label="Previous page">←</button><span id="counter">01 / 01</span><button id="next" aria-label="Next page">→</button></div>
  </nav>
  <script>
    const deck=document.querySelector('#deck');const slides=[...document.querySelectorAll('.slide')];const slideMarkup=slides.map(slide=>slide.innerHTML);const counter=document.querySelector('#counter');const progress=document.querySelector('#progress');const params=new URLSearchParams(location.search);const requestedPage=Number(params.get('page'));const renderAll=params.get('render')==='all';const placeholder='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';let current=Number.isFinite(requestedPage)&&requestedPage>0?requestedPage-1:0;current=Math.max(0,Math.min(current,slides.length-1));
    const pad=n=>String(n).padStart(2,'0');
    function prepareImages(slide){slide.querySelectorAll('img[data-src]').forEach(img=>{if(!img.src){img.src=placeholder;img.loading='lazy';img.decoding='async'}})}
    function mountSlide(index){const slide=slides[index];if(!slide)return;if(slide.dataset.mounted!=='true'){slide.innerHTML=slideMarkup[index];slide.dataset.mounted='true'}prepareImages(slide);slide.querySelectorAll('img[data-src]').forEach(img=>{if(img.src!==new URL(img.dataset.src,location.href).href){img.src=img.dataset.src;img.loading='eager'}})}
    function unmountSlide(index){if(renderAll||Math.abs(index-current)<=1)return;const slide=slides[index];if(slide?.dataset.mounted==='true'){slide.replaceChildren();delete slide.dataset.mounted}}
    function hydrateAll(){document.documentElement.classList.add('render-all');slides.forEach((_,index)=>mountSlide(index))}
    function hydrateDesktop(){if(renderAll){hydrateAll();return}slides.forEach((_,index)=>Math.abs(index-current)<=1?mountSlide(index):unmountSlide(index))}
    function show(i){if(!slides.length)return;current=Math.max(0,Math.min(i,slides.length-1));slides[current].scrollIntoView({behavior:'auto',inline:'start'});update();if(innerWidth>800)hydrateDesktop()}
    function update(){slides.forEach((s,i)=>s.classList.toggle('is-active',i===current));counter.textContent=`${pad(current+1)} / ${pad(slides.length)}`;progress.style.width=`${slides.length?(current+1)/slides.length*100:0}%`}
    addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))show(current+1);if(['ArrowLeft','PageUp'].includes(e.key))show(current-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
    document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);
    let wheelLock=false;addEventListener('wheel',e=>{if(innerWidth<=800||wheelLock)return;wheelLock=true;show(current+(e.deltaY>0||e.deltaX>0?1:-1));setTimeout(()=>wheelLock=false,250)},{passive:true});
    let startX=0;deck.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});deck.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50)show(current+(dx<0?1:-1))},{passive:true});
    slides.forEach((slide,index)=>{slide.dataset.mounted='true';if(!renderAll&&Math.abs(index-current)>1){slide.replaceChildren();delete slide.dataset.mounted}});
    let mobileObserver;if(!renderAll&&innerWidth<=800){mobileObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{const index=slides.indexOf(entry.target);if(entry.isIntersecting)mountSlide(index);else unmountSlide(index)}),{rootMargin:'100% 0px',threshold:.01});slides.forEach(slide=>mobileObserver.observe(slide));mountSlide(current);mountSlide(current+1)}else hydrateDesktop();
    addEventListener('beforeprint',hydrateAll);addEventListener('afterprint',()=>{if(!renderAll){document.documentElement.classList.remove('render-all');hydrateDesktop()}});
    update();deck.scrollLeft=innerWidth>800?current*innerWidth:0;if(innerWidth<=800&&current)slides[current]?.scrollIntoView({behavior:'auto'});
  </script>
